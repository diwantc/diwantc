name: Content checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Two jobs, so a lesson PR in review shows exactly what is wrong:
# - "Checks" must be green before review starts.
# - "Approval" stays red until all three language versions are approved.
# Branch protection on main requires both.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Structure, all three languages, alt text, sources.
      - name: Lesson rules
        run: node scripts/check-content.mjs

      - name: Links
        run: node scripts/check-links.mjs

      - name: Content checker tests
        run: npm test

      - name: Type check
        run: npx astro check

      # The build also validates every lesson's frontmatter against the schema.
      - name: Build
        run: npm run build

  approval:
    name: Approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only approved lessons (status, reviewer and date set) may reach main.
      - name: All lessons approved
        run: node scripts/check-content.mjs --require-approved
