name: Content checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Blocking: structure, all three languages, alt text, sources,
      # and only approved lessons may reach main.
      - name: Lesson rules
        run: node scripts/check-content.mjs --require-approved

      - name: Links
        run: node scripts/check-links.mjs

      - name: Content checker tests
        run: npm test

      - name: Type check
        run: npx astro check

      # The build also validates every lesson's frontmatter against the schema.
      - name: Build
        run: npm run build
