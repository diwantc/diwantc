name: Report an error in a lesson
description: Something in a lesson is wrong, outdated or unclear.
title: "Error: "
labels: ["error-report"]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson link or ID
      description: The page address, or the lesson ID (for example safety-l0-01).
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: ["العربية", "English", "Français"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the sentence if you can, and say what should be correct. A source helps.
    validations:
      required: true
